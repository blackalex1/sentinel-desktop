name: Release Sentinel Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v0.0.1)'
        required: true
        default: 'v0.0.1'

permissions:
  contents: write

jobs:
  build-and-release:
    name: 🖥️ Build & Publish Sentinel Desktop (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine Release Version
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:EVENT_NAME -eq "workflow_dispatch") {
            $rawVer = $env:INPUT_VERSION
          } else {
            $rawVer = $env:REF_NAME
          }
          if (-not $rawVer) { $rawVer = "v0.0.1" }
          Write-Host "Determined Release Version: $rawVer"
          "RELEASE_TAG=$rawVer" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Set up .NET 8 SDK
        uses: actions/setup-dotnet@3951f0dfe7a07e2313ec93c75700083e2005ddab # v4.3.0
        with:
          dotnet-version: '8.0.x'

      - name: Prepare Binaries and Drivers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path binaries
          
          # Fetch sentinel-core.dll from official engine release if absent
          if (-not (Test-Path "binaries\sentinel-core.dll")) {
            Write-Host "==> Fetching sentinel-core-windows-amd64.dll from blackalex1/sentinel-core..."
            try {
              curl.exe -L -s -f -o "binaries\sentinel-core.dll" "https://github.com/blackalex1/sentinel-core/releases/latest/download/sentinel-core-windows-amd64.dll"
              Write-Host "==> sentinel-core.dll ready."
            } catch {
              Write-Warning "Could not download sentinel-core.dll: $_"
            }
          }

      - name: Build & Publish SentinelDesktop
        shell: pwsh
        run: |
          $cleanVer = $env:RELEASE_TAG -replace '^v', ''
          Write-Host "==> Publishing SentinelDesktop for win-x64 (version $cleanVer)..."
          dotnet publish SentinelDesktop.csproj -c Release -r win-x64 --self-contained true -o publish_release /p:Version=$cleanVer /p:AssemblyVersion=$cleanVer.0 /p:FileVersion=$cleanVer.0

      - name: Package Release Artifacts & Checksums
        shell: pwsh
        run: |
          $tag = $env:RELEASE_TAG
          $zipFile = "SentinelDesktop-win-x64-$tag.zip"
          $exeFile = "SentinelDesktop-$tag.exe"

          Write-Host "==> Creating full release bundle: $zipFile"
          Compress-Archive -Path "publish_release\*" -DestinationPath $zipFile -Force

          Write-Host "==> Copying standalone executable: $exeFile"
          Copy-Item "publish_release\SentinelDesktop.exe" $exeFile

          Write-Host "==> Generating SHA256 checksums..."
          Get-FileHash -Algorithm SHA256 $zipFile, $exeFile | ForEach-Object {
            "$($_.Hash)  $(Split-Path $_.Path -Leaf)"
          } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb872386ac92a23c4b34498 # v2.2.1
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Sentinel Desktop ${{ env.RELEASE_TAG }}
          files: |
            SentinelDesktop-win-x64-*.zip
            SentinelDesktop-*.exe
            SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
