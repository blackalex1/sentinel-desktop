<section id="view-logs" class="tab-view">
        <div class="view-header">
          <div class="view-title-group">
            <h2 class="view-title" data-i18n="logs_title">Логи ядра в реальном времени</h2>
            <p class="view-desc" data-i18n="logs_desc">Потоковый вывод консоли Sing-box, Xray и Hysteria</p>
          </div>
          <div class="view-actions">
            <button id="btn-copy-logs" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <span>Копировать</span>
            </button>
            <button id="btn-clear-logs" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
              <span>Очистить</span>
            </button>
          </div>
        </div>

        <!-- Terminal Log Console -->
        <div class="terminal-container">
          <div class="terminal-toolbar">
            <div class="terminal-search">
              <input type="text" id="logs-search-input" placeholder="Фильтр по строке...">
            </div>
            <label class="terminal-autoscroll">
              <input type="checkbox" id="logs-autoscroll-toggle" checked>
              <span>Автопрокрутка</span>
            </label>
          </div>
          <div id="terminal-body" class="terminal-body">
            <!-- Dynamically populated via vpn-log events -->
          </div>
        </div>
      </section>
