<section id="view-dashboard" class="tab-view active">
        <!-- Centerpiece: Cyber Radar Ring with Mascot Power Button -->
        <div class="radar-container">
          <div class="radar-bezel">
            <!-- Authentic Tactical Radar Scope Canvas (Outer Ring) -->
            <canvas id="tactical-radar-canvas" class="tactical-radar-canvas"></canvas>
            <div id="radar-pulse-wave" class="radar-wave"></div>
            <button id="btn-power-connect" class="power-button power-idle" aria-label="Toggle Connection" title="Нажмите для подключения / отключения">
              <div class="power-mascot-box">
                <canvas id="power-mascot-canvas"></canvas>
              </div>
              <div class="power-status-badge">
                <span id="power-status-label" class="power-text">ПОДКЛЮЧИТЬ</span>
                <span id="power-timer-label" class="power-timer hidden">00:00:00</span>
              </div>
            </button>
          </div>

          <!-- Quick Server Selector Pill -->
          <div class="server-picker-pill">
            <button id="btn-quick-server" class="pill-btn">
              <span id="quick-server-flag" class="server-flag">🌐</span>
              <span id="quick-server-name" class="server-name">Выберите сервер</span>
              <span id="quick-server-proto" class="proto-tag">VLESS</span>
              <span id="quick-server-ping" class="ping-tag">—</span>
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
            </button>

            <!-- Dropdown Menu -->
            <div id="quick-server-dropdown" class="server-dropdown hidden">
              <div class="dropdown-header" data-i18n="select_server">ВЫБЕРИТЕ СЕРВЕР</div>
              <div id="quick-server-list" class="dropdown-list"></div>
            </div>
          </div>

          <!-- Inbound Mode & Core Selector Bar -->
          <div class="inbound-mode-bar">
            <button type="button" class="mode-chip" id="btn-mode-tun" title="Виртуальный адаптер Wintun — весь сетевой трафик">
              <span class="mode-dot"></span>
              <span class="mode-text">TUN (Wintun)</span>
            </button>
            <button type="button" class="mode-chip active" id="btn-mode-sysproxy" title="Системный прокси Windows (HTTP/SOCKS5)">
              <span class="mode-dot"></span>
              <span class="mode-text">System Proxy</span>
            </button>
            <div class="dash-core-picker" title="Рабочее VPN-ядро">
              <span class="dash-core-icon">⚡</span>
              <select id="dash-core-select" class="dash-core-select">
                <option value="singbox">Sing-box</option>
                <option value="xray">Xray-core</option>
                <option value="hysteria">Hysteria 2</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Telemetry Bento Grid -->
        <div class="telemetry-bento">
          <!-- Download Speed Card -->
          <div class="bento-card">
            <div class="bento-header">
              <span class="bento-title" data-i18n="dash_download">СКАЧИВАНИЕ</span>
              <svg class="bento-icon icon-emerald" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 17l9.2-9.2M17 17V8H8"/></svg>
            </div>
            <div class="bento-val" id="stat-download-speed">0 KB/s</div>
            <div class="bento-sub" id="stat-total-download">Всего: 0 MB</div>
          </div>

          <!-- Upload Speed Card -->
          <div class="bento-card">
            <div class="bento-header">
              <span class="bento-title" data-i18n="dash_upload">ОТДАЧА</span>
              <svg class="bento-icon icon-cyan" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 7L7.8 16.2M7 7v9h9"/></svg>
            </div>
            <div class="bento-val" id="stat-upload-speed">0 KB/s</div>
            <div class="bento-sub" id="stat-total-upload">Всего: 0 MB</div>
          </div>

          <!-- Ping Latency Card -->
          <div class="bento-card">
            <div class="bento-header">
              <span class="bento-title" data-i18n="dash_ping">ЗАДЕРЖКА</span>
              <svg class="bento-icon icon-violet" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
            </div>
            <div class="bento-val" id="stat-ping-ms">—</div>
            <div class="bento-sub" id="stat-active-protocol">ПРОТОКОЛ: —</div>
          </div>

          <!-- Public IP & Geo Card -->
          <div class="bento-card">
            <div class="bento-header">
              <span class="bento-title">ПУБЛИЧНЫЙ IP</span>
              <button id="btn-refresh-ip" class="btn-icon-mini" title="Обновить IP">
                <svg viewBox="0 0 24 24" width="12" height="12" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6M1 20v-6h6M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
              </button>
            </div>
            <div class="bento-val" id="stat-public-ip">...</div>
            <div class="bento-sub" id="stat-public-geo">Определение...</div>
          </div>
        </div>
      </section>
