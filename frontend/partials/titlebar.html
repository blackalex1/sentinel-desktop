<header class="titlebar" style="--wails-draggable: drag;">
    <div class="titlebar-left" style="--wails-draggable: drag;">
      <div class="app-logo" style="--wails-draggable: drag; background: transparent; border: none;">
        <img src="appicon.png" alt="Mascot Logo" style="width: 26px; height: 26px; border-radius: 6px; object-fit: cover; box-shadow: 0 0 10px rgba(139, 92, 246, 0.4);">
      </div>
      <div class="app-info" style="--wails-draggable: drag;">
        <span class="app-title">SENTINEL SECURE</span>
        <span class="app-badge">DESKTOP v2.0</span>
      </div>
    </div>

    <div class="titlebar-center" style="--wails-draggable: drag;">
      <!-- Live Status Pill -->
      <div id="titlebar-status-pill" class="status-pill status-disconnected" style="--wails-draggable: no-drag;">
        <span class="status-dot"></span>
        <span id="titlebar-status-text" class="status-text">ОТКЛЮЧЕНО</span>
      </div>
      <!-- Latency Badge -->
      <div id="titlebar-ping-badge" class="ping-chip hidden" style="--wails-draggable: no-drag;">
        <span class="ping-icon">⚡</span>
        <span id="titlebar-ping-text">0 ms</span>
      </div>
    </div>

    <div class="titlebar-right" style="--wails-draggable: no-drag;">
      <button id="btn-minimize" class="titlebar-btn" title="Свернуть" aria-label="Minimize" style="--wails-draggable: no-drag;">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>
      </button>
      <button id="btn-close" class="titlebar-btn btn-close" title="Закрыть" aria-label="Close" style="--wails-draggable: no-drag;">
        <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M6 18L18 6"/></svg>
      </button>
    </div>
  </header>
