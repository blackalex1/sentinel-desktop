<section id="view-servers" class="tab-view">
        <div class="view-header">
          <div class="view-title-group">
            <h2 class="view-title" data-i18n="servers_title">Управление серверами</h2>
            <p class="view-desc" data-i18n="servers_desc">Узлы подключения, подписки и профили</p>
          </div>
          <div class="view-actions">
            <button id="btn-clipboard-quick-add" class="btn btn-secondary" title="Вставить и добавить узел из буфера обмена">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>
              <span>Из буфера</span>
            </button>
            <button id="btn-ping-all" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
              <span data-i18n="ping_all">Пинг всех</span>
            </button>
            <button id="btn-import-sub" class="btn btn-secondary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
              <span data-i18n="import_sub">Импорт</span>
            </button>
            <button id="btn-add-server" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              <span data-i18n="add_server">Добавить</span>
            </button>
          </div>
        </div>

        <!-- Search & Filter Bar -->
        <div class="filter-bar">
          <div class="search-box">
            <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" id="servers-search-input" placeholder="Поиск по имени, адресу, протоколу..." data-i18n-placeholder="search_servers">
          </div>
          <div class="filter-chips">
            <button class="filter-chip active" data-filter="all">Все</button>
            <button class="filter-chip" data-filter="fav">★ Избранные</button>
            <button class="filter-chip" data-filter="vless">VLESS</button>
            <button class="filter-chip" data-filter="vmess">VMess</button>
            <button class="filter-chip" data-filter="trojan">Trojan</button>
            <button class="filter-chip" data-filter="hy2">Hysteria 2</button>
            <button class="filter-chip" data-filter="wireguard">WireGuard</button>
            <button class="filter-chip" data-filter="shadowsocks">Shadowsocks</button>
          </div>
        </div>

        <!-- Servers Grid Container -->
        <div id="servers-list-container" class="servers-grid">
          <!-- Dynamically populated -->
        </div>
      </section>
