<section id="view-settings" class="tab-view">
        <div class="view-header">
          <div class="view-title-group">
            <h2 class="view-title" data-i18n="settings_title">Параметры приложения</h2>
            <p class="view-desc" data-i18n="settings_desc">Настройки системы, сети, портов и языка</p>
          </div>
          <div class="view-actions">
            <button id="btn-save-settings" class="btn btn-primary">
              <svg viewBox="0 0 24 24" width="14" height="14" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
              <span>Сохранить</span>
            </button>
          </div>
        </div>

        <div class="settings-grid">
          <!-- Core Selection Settings -->
          <div class="settings-card">
            <h3 class="settings-card-title">VPN-Ядро и протоколы</h3>
            <div class="setting-row">
              <label>Активное VPN-ядро:</label>
              <select id="setting-active-core">
                <option value="singbox">Sing-box (TUN / Wintun & System Proxy)</option>
                <option value="xray">Xray-core (VLESS Reality & Vision)</option>
                <option value="hysteria">Hysteria 2 (UDP Brutal / Salamander)</option>
              </select>
            </div>
            <div class="setting-row">
              <label>Уровень логирования ядра:</label>
              <select id="setting-log-level">
                <option value="info">Info (Рекомендуется)</option>
                <option value="warn">Warning</option>
                <option value="error">Error</option>
                <option value="debug">Debug (Подробно)</option>
                <option value="trace">Trace (Все пакеты)</option>
              </select>
            </div>
          </div>

          <!-- System Settings -->
          <div class="settings-card">
            <h3 class="settings-card-title">Системные параметры</h3>
            <div class="setting-item">
              <div>
                <div class="setting-name">Автозапуск с Windows</div>
                <div class="setting-hint">Запускать Sentinel при включении компьютера</div>
              </div>
              <input type="checkbox" id="setting-autostart">
            </div>
            <div class="setting-item">
              <div>
                <div class="setting-name">Сворачивать в системный трей</div>
                <div class="setting-hint">При закрытии окна прятать приложение в трей</div>
              </div>
              <input type="checkbox" id="setting-close-to-tray" checked>
            </div>
          </div>

          <!-- Network Settings -->
          <div class="settings-card">
            <h3 class="settings-card-title">Сетевые порты</h3>
            <div class="setting-row">
              <label>Локальный SOCKS5 порт:</label>
              <input type="number" id="setting-socks-port" value="10808">
            </div>
            <div class="setting-row">
              <label>Локальный HTTP порт:</label>
              <input type="number" id="setting-http-port" value="10809">
            </div>
            <div class="setting-row">
              <label>DNS Сервер:</label>
              <select id="setting-dns-server">
                <option value="1.1.1.1">Cloudflare (1.1.1.1)</option>
                <option value="8.8.8.8">Google (8.8.8.8)</option>
                <option value="9.9.9.9">Quad9 (9.9.9.9)</option>
                <option value="77.88.8.8">Yandex (77.88.8.8)</option>
              </select>
            </div>
          </div>

          <!-- Language & Appearance -->
          <div class="settings-card">
            <h3 class="settings-card-title">Язык и внешний вид</h3>
            <div class="setting-row">
              <label>Язык интерфейса:</label>
              <select id="setting-language">
                <option value="ru">Русский</option>
                <option value="en">English</option>
              </select>
            </div>
            <div class="setting-row">
              <label>Тема оформления:</label>
              <select id="setting-theme">
                <option value="cyber">Cyber Void (Темная)</option>
                <option value="cosmic">Cosmic Violet</option>
              </select>
            </div>
          </div>
        </div>
      </section>
