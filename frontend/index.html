<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sentinel Secure Connect</title>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="theme-cyber">
  <!-- Titlebar Module -->
  <div id="module-titlebar"></div>

  <!-- Main Application Container -->
  <div class="app-container">
    <!-- Left Navigation Sidebar Module -->
    <div id="module-sidebar"></div>

    <!-- Content Workspace -->
    <main class="workspace" id="module-views">
      <div id="container-dashboard"></div>
      <div id="container-servers"></div>
      <div id="container-routing"></div>
      <div id="container-cores"></div>
      <div id="container-diagnostics"></div>
      <div id="container-logs"></div>
      <div id="container-hotspot"></div>
      <div id="container-settings"></div>
    </main>
  </div>

  <!-- Modals & DevTools Module -->
  <div id="module-modals"></div>

  <!-- Toast Notification Container -->
  <div id="toasts-container" class="toasts-container"></div>

  <!-- Scripts -->
  <script src="js/i18n.js"></script>
  <script src="js/bridge.js"></script>
  <script src="js/state.js"></script>
  <!-- Mascot Engine -->
  <script src="js/mascot/constants.js"></script>
  <script src="js/mascot/particles.js"></script>
  <script src="js/mascot/renderers/chassis.js"></script>
  <script src="js/mascot/renderers/coolant.js"></script>
  <script src="js/mascot/renderers/visor.js"></script>
  <script src="js/mascot/renderers/reactor.js"></script>
  <script src="js/mascot/mascot_windows.js"></script>
  <script src="js/mascot/tactical_radar.js"></script>
  <!-- Views -->
  <script src="js/views/toasts.js"></script>
  <script src="js/views/titlebar.js"></script>
  <script src="js/views/sidebar.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/servers.js"></script>
  <script src="js/views/routing.js"></script>
  <script src="js/views/cores.js"></script>
  <script src="js/views/diagnostics.js"></script>
  <script src="js/views/logs.js"></script>
  <script src="js/views/hotspot/hotspot_adapters.js"></script>
  <script src="js/views/hotspot/hotspot_client.js"></script>
  <script src="js/views/hotspot/hotspot_server.js"></script>
  <script src="js/views/hotspot.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/modals.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
