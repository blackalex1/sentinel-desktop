[package]
name = "x-pc"
version = "1.0.0"
description = "Sentinel Secure Connect Windows 11 Multi-Core VPN Client"
authors = ["Sentinel Dev"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
winreg = "0.55"
windows-sys = { version = "0.52", features = ["Win32_UI_Shell", "Win32_Foundation"] }
reqwest = { version = "0.12", features = ["json", "stream", "default-tls"] }
zip = "2.2"
futures-util = "0.3"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
